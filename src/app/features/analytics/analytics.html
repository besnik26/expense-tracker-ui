<main class="analytics-main">
    @if (analyticsData(); as data) {

        <div class="title">
            <h3>Analytics</h3>
        </div>

        <div class="analytics-period">
            <button
                type="button"
                [class.active]="selectedMonths() === 3"
                (click)="onPeriodChange(3)"
            >
                3 Months
            </button>

            <button
                type="button"
                [class.active]="selectedMonths() === 6"
                (click)="onPeriodChange(6)"
            >
                6 Months
            </button>

            <button
                type="button"
                [class.active]="selectedMonths() === 12"
                (click)="onPeriodChange(12)"
            >
                12 Months
            </button>
        </div>


        <app-total-stats [data]="data"></app-total-stats>
        <app-monthly-expenses [analyticsData]="data"></app-monthly-expenses>
        <app-expense-breakdown [analyticsData]="data"></app-expense-breakdown>
        <app-saving-trend [analyticsData]="data"></app-saving-trend>
        
        
    } @else {
        <p>Loading...</p>
    }
</main>
