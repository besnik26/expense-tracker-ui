<main class="transactions-main" [attr.aria-busy]="loading()">
  <header class="transactions-header">
    <h3 class="title">Transactions</h3>
    <button
      class="btn btn-primary"
      type="button"
      (click)="openTransactionDialog()">
      Add transaction
    </button>
  </header>

  <dialog
    #transactionDialog
    class="transaction-dialog"
    aria-labelledby="transaction-dialog-title"
    (click)="closeOnBackdrop($event)">

    <header class="transaction-dialog-header">
      <h2 id="transaction-dialog-title">Add transaction</h2>
      <button
        class="btn btn-secondary"
        type="button"
        (click)="closeTransactionDialog()">
        Close
      </button>
    </header>

    <app-transaction-form
      (transactionCreated)="onTransactionCreated()">
    </app-transaction-form>
  </dialog>

  <app-transactions-table
    [transactions]="transactions()"
    [pagination]="pagination()"
    [month]="month()"
    [category]="category()"
    [type]="type()"
    [categories]="categories"
    [loading]="loading()"
    [errorMessage]="errorMessage()"
    (filtersChanged)="onFiltersChanged($event)"
    (pageChanged)="goToPage($event)"
    (deleteRequested)="deleteTransaction($event)"
    (retryRequested)="loadTransactions()">
  </app-transactions-table>

</main>
