<main class="transactions-main">
  <button
    class="btn btn-primary"
    type="button"
    (click)="openTransactionDialog()">
    Add transaction
  </button>

  <dialog
    #transactionDialog
    class="transaction-dialog"
    aria-labelledby="transaction-dialog-title"
    (click)="closeOnBackdrop($event)">

    <header class="transaction-dialog-header">
      <h2 id="transaction-dialog-title">Add transaction</h2>
      <button
        class="btn btn-secondary"
        type="button"
        (click)="closeTransactionDialog()">
        Close
      </button>
    </header>

    <app-transaction-form
      (transactionCreated)="onTransactionCreated()">
    </app-transaction-form>
  </dialog>
  
  <ul>
      @for (item of transactions(); track $index) {
          <li>
            {{ item.type }} - {{ item.category }} - {{ item.amount }} - {{ item.date }}
            <button type="button" (click)="deleteTransaction(item._id)">Delete</button>
          </li>
      }
  </ul>

</main>
